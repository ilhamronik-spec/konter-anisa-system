name: V30 Role Separation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v30-role-separation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-admin-controls-from-employee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Admin UI from Karyawan portal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('rules-v29.js')
          s = p.read_text(encoding='utf-8')
          old = "  const VERSION = 'V29 — CORE REGULATIONS';"
          if old in s:
              s = s.replace(old, "  const VERSION = 'V30 — KARYAWAN ROLE';", 1)
          call = "    buildAdminPanel();\n"
          if call in s:
              s = s.replace(call, "    // Admin/Purchasing controls are intentionally NOT rendered in the Karyawan portal.\n", 1)
          # Defensive cleanup in case a cached/older DOM injected the controls before this script completes.
          marker = "    installCaptureGuards();\n"
          cleanup = "    document.getElementById('v29AdminOpen')?.remove();\n    document.getElementById('v29AdminPanel')?.remove();\n"
          if cleanup not in s and marker in s:
              s = s.replace(marker, cleanup + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit role separation
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'chatgpt-v30'
          git config user.email 'chatgpt-v30@users.noreply.github.com'
          git add rules-v29.js
          git commit -m 'V30 remove Admin controls from Karyawan portal'
          git push
