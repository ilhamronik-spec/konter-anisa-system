name: V34 Admin Override Policy
on:
  push:
    paths:
      - '.github/workflows/v34-admin-override-policy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load V34 transaction policy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="transactions-v34.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "chatgpt-v34"
          git config user.email "chatgpt-v34@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "V34 load global admin override policy"
          git push
