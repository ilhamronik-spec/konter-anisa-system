name: V31 Input Focus Layout

on:
  push:
    paths:
      - 'layout-v31.css'
      - 'layout-v31.js'
      - '.github/workflows/v31-input-focus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject V31 layout assets into index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="layout-v31.css?v=31">'
          js = '<script src="layout-v31.js?v=31"></script>'
          if css not in s:
              s = s.replace('</head>', css + '\n</head>')
          if js not in s:
              s = s.replace('</body>', js + '\n</body>')
          p.write_text(s, encoding='utf-8')

      - name: Commit V31 layout
        run: |
          git config user.name "chatgpt-v31"
          git config user.email "chatgpt-v31@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "V31 already injected"
          else
            git commit -m "V31 prioritize employee input forms and collapse static rules"
            git push origin main
          fi
