name: V28 Stock Live Calculation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v28-stock-live-calc.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale stock calculations
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'V28 STOCK LIVE CALC' not in s:
              patch = r'''
<script>
/* V28 STOCK LIVE CALC
   Nilai Terjual/Uang/Margin/Sisa Modal tidak boleh memakai contoh lama.
   Semua dihitung hanya setelah Stok Akhir diisi. */
(function(){
  function setText(id,value){ const el=document.getElementById(id); if(el) el.textContent=value; }

  window.calcPkgEnd=function(i){
    const p=pkgCatalog[i-1];
    const el=document.getElementById('pkgEnd'+i);
    if(!p||!el) return;
    const avail=Number(p.stock||0)+Number(p.purchaseQty||0);
    el.max=avail;
    const raw=String(el.value??'').trim();

    if(raw===''){
      setText('pkgSold'+i,'—');
      setText('pkgMoney'+i,'—');
      setText('pkgMargin'+i,'—');
      setText('pkgRemainModal'+i,'—');
      calcPkgTotals();
      return;
    }

    let e=Math.max(0,Number(raw)||0);
    if(e>avail){ e=avail; el.value=avail; }
    const sold=avail-e;
    setText('pkgSold'+i,String(sold));
    setText('pkgMoney'+i,fmt(sold*p.activeSell));
    setText('pkgMargin'+i,fmt(sold*(p.activeSell-p.activeBase)));
    setText('pkgRemainModal'+i,fmt(e*p.activeBase));
    calcPkgTotals();
  };

  window.calcPkgTotals=function(){
    let avail=0,sold=0,money=0,margin=0,filled=0,required=0;
    pkgCatalog.forEach((p,ix)=>{
      const i=ix+1;
      const a=Number(p.stock||0)+Number(p.purchaseQty||0);
      avail+=a;
      if(a>0) required++;
      const el=document.getElementById('pkgEnd'+i);
      if(!el) return;
      const raw=String(el.value??'').trim();
      if(raw==='') return;
      if(a>0) filled++;
      const e=Math.min(a,Math.max(0,Number(raw)||0));
      const x=a-e;
      sold+=x;
      money+=x*p.activeSell;
      margin+=x*(p.activeSell-p.activeBase);
    });
    setText('pkgTotalAvail',avail+' unit');
    if(filled===0){
      setText('pkgTotalSold','Belum diisi');
      setText('pkgTotalMoney','Belum diisi');
      setText('pkgTotalMargin','Belum diisi');
      return;
    }
    setText('pkgTotalSold',(filled<required?filled+'/'+required+' terisi • ':'')+sold+' unit');
    setText('pkgTotalMoney',fmt(money)+(filled<required?' sementara':''));
    setText('pkgTotalMargin',fmt(margin)+(filled<required?' sementara':''));
  };

  window.calcCigEnd=function(i){
    const c=cigCatalog[i-1];
    const el=document.getElementById('cigEnd'+i);
    const moveEl=document.getElementById('move'+i);
    if(!c||!el) return;
    const mv=Number(moveEl?.value||0);
    const avail=Number(c.display||0)+mv;
    const wh=Number(c.warehouse||0)+Number(c.purchaseQty||0)-mv;
    el.max=avail;
    setText('cigWh'+i,String(wh));
    setText('cigWhModal'+i,fmt(wh*c.base));
    const raw=String(el.value??'').trim();

    if(raw===''){
      setText('cigSold'+i,'—');
      setText('cigSales'+i,'—');
      setText('cigMargin'+i,'—');
      setText('cigDispModal'+i,'—');
      calcCigTotals();
      return;
    }

    let e=Math.max(0,Number(raw)||0);
    if(e>avail){ e=avail; el.value=avail; }
    const sold=avail-e;
    setText('cigSold'+i,String(sold));
    setText('cigSales'+i,fmt(sold*c.sell));
    setText('cigMargin'+i,fmt(sold*(c.sell-c.base)));
    setText('cigDispModal'+i,fmt(e*c.base));
    calcCigTotals();
  };

  window.calcCigTotals=function(){
    let sales=0,margin=0,dm=0,wm=0,filled=0,required=0;
    cigCatalog.forEach((c,ix)=>{
      const i=ix+1;
      const mv=Number(document.getElementById('move'+i)?.value||0);
      const avail=Number(c.display||0)+mv;
      const wh=Number(c.warehouse||0)+Number(c.purchaseQty||0)-mv;
      wm+=wh*c.base;
      if(avail>0) required++;
      const el=document.getElementById('cigEnd'+i);
      if(!el) return;
      const raw=String(el.value??'').trim();
      if(raw==='') return;
      if(avail>0) filled++;
      const e=Math.min(avail,Math.max(0,Number(raw)||0));
      const sold=avail-e;
      sales+=sold*c.sell;
      margin+=sold*(c.sell-c.base);
      dm+=e*c.base;
    });
    setText('cigWarehouseModal',fmt(wm));
    if(filled===0){
      setText('cigSalesTotal','Belum diisi');
      setText('cigMarginTotal','Belum diisi');
      setText('cigDisplayModal','Belum diisi');
      return;
    }
    setText('cigSalesTotal',fmt(sales)+(filled<required?' sementara':''));
    setText('cigMarginTotal',fmt(margin)+(filled<required?' sementara':''));
    setText('cigDisplayModal',fmt(dm)+(filled<required?' sementara':''));
  };

  function refreshBlankRowsV28(){
    document.querySelectorAll('.pkg-end').forEach((el,ix)=>calcPkgEnd(ix+1));
    document.querySelectorAll('.cig-end').forEach((el,ix)=>calcCigEnd(ix+1));
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',refreshBlankRowsV28,{once:true});
  else refreshBlankRowsV28();
  window.addEventListener('load',refreshBlankRowsV28,{once:true});
})();
</script>
'''
              s = s.replace('</body>', patch + '\n</body>', 1)

          # Jelaskan formula langsung di UI.
          s = s.replace('<th>Terjual</th><th>Jumlah Uang</th><th>Margin</th><th>Sisa Modal</th>',
                        '<th>Terjual (Tersedia − Akhir)</th><th>Jumlah Uang</th><th>Margin</th><th>Sisa Modal</th>')
          s = s.replace('Stok tersedia sudah memperhitungkan belanja Paket hari ini. Stok Akhir tidak boleh lebih besar dari Stok Tersedia.',
                        'Stok tersedia sudah memperhitungkan belanja Paket hari ini. Terjual = Stok Tersedia − Stok Akhir. Uang, margin, dan sisa modal baru dihitung setelah Stok Akhir diisi.')
          s = s.replace('UI V27 — STOCK INPUT', 'UI V28 — LIVE STOCK CALC')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S))
          Path('/tmp/konter-anisa-v28.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/konter-anisa-v28.js

      - name: Commit V28
        run: |
          git config user.name "chatgpt-v28"
          git config user.email "chatgpt-v28@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "V28 calculate stock outputs only after ending stock input"
            git push
          else
            echo "No changes"
          fi
