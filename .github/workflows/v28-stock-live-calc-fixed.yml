name: V28 Stock Live Calculation Fixed

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v28-stock-live-calc-fixed.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          b64=' lbCkgcmV0dXJuOwogICAgY29uc3QgYXZhaWw9TnVtYmVyKHAuc3RvY2t8fDApK051bWJlcihwLnB1cmNoYXNlUXR5fHwwKTsKICAgIGVsLm1heD1hdmFpbDsKICAgIGNvbnN0IHJhdz1TdHJpbmcoZWwudmFsdWU/PycnKS50cmltKCk7CgogICAgaWYocmF3PT09Jycp ewogICAgICBzZXRUZXh0KCdwa2dTb2xkJytpLOKAlCcpOwogICAgICBzZXRUZXh0KCdwa2dNb25leScr  '
          patch=base64.b64decode(b64).decode('utf-8')
          if 'V28 STOCK LIVE CALC' not in s:
              s=s.replace('</body>',patch+'\n</body>',1)
          s=s.replace('<th>Terjual</th><th>Jumlah Uang</th><th>Margin</th><th>Sisa Modal</th>','<th>Terjual (Tersedia - Akhir)</th><th>Jumlah Uang</th><th>Margin</th><th>Sisa Modal</th>')
          s=s.replace('Stok tersedia sudah memperhitungkan belanja Paket hari ini. Stok Akhir tidak boleh lebih besar dari Stok Tersedia.','Stok tersedia sudah memperhitungkan belanja Paket hari ini. Terjual = Stok Tersedia - Stok Akhir. Uang, margin, dan sisa modal baru dihitung setelah Stok Akhir diisi.')
          s=s.replace('UI V27 — STOCK INPUT','UI V28 — LIVE STOCK CALC')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit V28
        run: |
          git config user.name "chatgpt-v28"
          git config user.email "chatgpt-v28@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "V28 compute stock outputs only from entered ending stock"
            git push
          fi
