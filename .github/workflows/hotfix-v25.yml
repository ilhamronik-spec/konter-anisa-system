name: Hotfix Konter Anisa V25

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-v25.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Piutang: jumlah pembayaran harus bisa diisi manual.
          s = s.replace(
            '<label>Saldo Piutang</label><input class="input" disabled="" id="payDebtBalance" value="120.000"/>',
            '<label>Jumlah Dibayar</label><input autocomplete="off" class="input money-entry" data-ui-input="formatMoneyInput(this)" id="payDebtBalance" inputmode="numeric" type="text" value="120.000"/>'
          )
          s = s.replace(
            "function syncPayDebtBalance(){\n  const name=document.getElementById('payDebtSelect').value;\n  const bal=payDebtBalanceMap[name]||0;\n  document.getElementById('payDebtBalance').value=bal.toLocaleString('id-ID');\n}",
            "function syncPayDebtBalance(){\n  const name=document.getElementById('payDebtSelect').value;\n  const bal=payDebtBalanceMap[name]||0;\n  const input=document.getElementById('payDebtBalance');\n  if(input) input.value=bal?bal.toLocaleString('id-ID'):'';\n}"
          )
          s = s.replace(
            "function addPaymentEntry(){\n  const name=document.getElementById('payDebtSelect').value;\n  const amount=payDebtBalanceMap[name]||moneyValue(document.getElementById('payDebtBalance'));\n  if(amount<=0){uiToast('Saldo piutang tidak valid.','warn');return;}\n  paymentEntries.push({name,amount});\n  renderPaymentEntries();\n  setPaymentMode(true);\n  uiToast('Pembayaran piutang ditambahkan.','ok');\n}",
            "function addPaymentEntry(){\n  const name=document.getElementById('payDebtSelect').value;\n  const amount=moneyValue(document.getElementById('payDebtBalance'));\n  const max=payDebtBalanceMap[name]||0;\n  if(amount<=0){uiToast('Jumlah pembayaran piutang harus diisi.','warn');return;}\n  if(max>0 && amount>max){uiToast('Jumlah bayar melebihi saldo piutang.','warn');return;}\n  paymentEntries.push({name,amount});\n  renderPaymentEntries();\n  setPaymentMode(true);\n  uiToast('Pembayaran piutang ditambahkan.','ok');\n}"
          )

          # 2) Tombol sebelumnya: jadikan direct onclick juga, supaya tidak mati walau event data-ui gagal.
          s = s.replace(
            '<a class="btn" data-ui-click="smartPrevStep()" href="#" id="globalPrevBtn" role="button">← Sebelumnya</a><a class="btn blue" data-ui-click="smartNextStep()" href="#" id="globalNextBtn" role="button">Berikutnya →</a>',
            '<a class="btn" data-ui-click="smartPrevStep()" href="#" id="globalPrevBtn" onclick="smartPrevStep();return false" role="button">← Sebelumnya</a><a class="btn blue" data-ui-click="smartNextStep()" href="#" id="globalNextBtn" onclick="smartNextStep();return false" role="button">Berikutnya →</a>'
          )
          s = s.replace(
            '.footer-actions .actions{display:flex;gap:10px}',
            '.footer-actions .actions{display:flex;gap:10px}.footer-actions .btn{pointer-events:auto;cursor:pointer}'
          )

          # 3) Mitra: nominal pakai titik, tambah custom, margin tetap Rp1.700/transaksi.
          old_select = '<div class="form-grid"><div class="field"><label>Nominal Mitra</label><select class="select" data-ui-change="calcMitra()" id="mitraNominal"><option>5000</option><option>10000</option><option>15000</option><option selected="">20000</option><option>25000</option><option>30000</option><option>35000</option><option>40000</option><option>50000</option><option>60000</option><option>100000</option><option>150000</option><option>200000</option></select></div><div class="field"><label>Jumlah Transaksi (Qty)</label><input class="input" data-ui-input="calcMitra()" id="mitraQty" min="0" type="number" value="13"/></div></div>'
          new_select = '<div class="form-grid"><div class="field"><label>Nominal Mitra</label><select class="select" data-ui-change="calcMitra()" id="mitraNominal"><option value="5000">5.000</option><option value="10000">10.000</option><option value="15000">15.000</option><option selected="" value="20000">20.000</option><option value="25000">25.000</option><option value="30000">30.000</option><option value="35000">35.000</option><option value="40000">40.000</option><option value="50000">50.000</option><option value="60000">60.000</option><option value="100000">100.000</option><option value="150000">150.000</option><option value="200000">200.000</option><option value="custom">Custom</option></select></div><div class="field" id="mitraCustomWrap" style="display:none"><label>Nominal Custom</label><input autocomplete="off" class="input money-entry" data-ui-input="formatMoneyInput(this);calcMitra()" id="mitraCustomNominal" inputmode="numeric" placeholder="Isi nominal sendiri" type="text"/></div><div class="field"><label>Jumlah Transaksi (Qty)</label><input class="input" data-ui-input="calcMitra()" id="mitraQty" min="0" type="number" value="13"/></div></div>'
          s = s.replace(old_select, new_select)
          s = s.replace(
            'function calcMitra(){const n=Number(mitraNominal.value||0),q=Math.max(0,Number(mitraQty.value||0));mitraModal.textContent=fmt(n*q);mitraMargin.textContent=fmt(q*1700);mitraQtyOut.textContent=q+\' transaksi\'}',
            "function getMitraNominal(){const sel=String(document.getElementById('mitraNominal')?.value||'0');const wrap=document.getElementById('mitraCustomWrap');if(sel==='custom'){if(wrap)wrap.style.display='block';return moneyValue(document.getElementById('mitraCustomNominal'));}if(wrap)wrap.style.display='none';return Number(sel)||0}\nfunction calcMitra(){const n=getMitraNominal(),q=Math.max(0,Number(mitraQty.value||0));mitraModal.textContent=fmt(n*q);mitraMargin.textContent=fmt(q*1700);mitraQtyOut.textContent=q+' transaksi'}"
          )
          s = s.replace(
            "if(type==='mitra'){\n    calcMitra();\n    const nominal=Number(mitraNominal.value||0),qty=Math.max(0,Number(mitraQty.value||0));\n    if(qty<=0)return uiToast('Jumlah transaksi Mitra harus lebih dari 0.','warn');\n    row={nominal,qty,modal:nominal*qty,margin:qty*1700};\n  }",
            "if(type==='mitra'){\n    calcMitra();\n    const nominal=getMitraNominal(),qty=Math.max(0,Number(mitraQty.value||0));\n    if(nominal<=0)return uiToast('Nominal Mitra harus diisi.','warn');\n    if(qty<=0)return uiToast('Jumlah transaksi Mitra harus lebih dari 0.','warn');\n    row={nominal,qty,modal:nominal*qty,margin:qty*1700};\n  }"
          )
          s = s.replace('<div class="sumrow"><span>Nominal</span><b>Pilihan tetap</b></div>', '<div class="sumrow"><span>Nominal</span><b>Pilihan + Custom</b></div>')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched file
        run: |
          git config user.name "chatgpt-hotfix"
          git config user.email "chatgpt-hotfix@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "Hotfix V25 piutang previous mitra"
            git push
          else
            echo "No changes"
          fi
