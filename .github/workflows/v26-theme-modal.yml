name: V26 Modal Blank Purple Theme

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v26-theme-modal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch modal input and theme
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) Modal input shift berjalan harus kosong saat halaman pertama dibuka.
          def blank_modal(match):
              tag = match.group(0)
              tag = re.sub(r'\svalue="[^"]*"', '', tag)
              if 'placeholder=' not in tag:
                  if tag.endswith('/>'):
                      tag = tag[:-2] + ' placeholder="Isi saldo aktual"/>'
                  else:
                      tag = tag[:-1] + ' placeholder="Isi saldo aktual">'
              return tag

          s = re.sub(r'<input(?=[^>]*class="[^"]*\bmodal-input\b[^"]*")[^>]*?/?>', blank_modal, s)
          s = re.sub(r'(<b id="modalInputTotal"[^>]*>).*?(</b>)', r'\1Belum diisi\2', s, count=1)
          s = re.sub(r'(<b id="modalInputDiff"[^>]*>).*?(</b>)', r'\1Belum dihitung\2', s, count=1)

          new_calc = '''function calcModalInput(){
            let total=0,filled=0;
            modalCatalog.forEach((m,ix)=>{
              const i=ix+1,el=document.getElementById('modalInput'+i),diffEl=document.getElementById('modalDiff'+i);
              if(!el||!diffEl)return;
              const raw=String(el.value??'').trim();
              diffEl.classList.remove('diff-up','diff-down','diff-zero','diff-pending');
              el.classList.remove('changed-input','ok-input','pending-input');
              if(raw===''){
                diffEl.textContent='Belum diisi';
                diffEl.classList.add('diff-pending');
                el.classList.add('pending-input');
                return;
              }
              filled++;
              const val=moneyValue(el),diff=val-Number(m.value||0);total+=val;
              diffEl.textContent=fmt(diff);
              if(diff>0){diffEl.classList.add('diff-up');el.classList.add('changed-input')}
              else if(diff<0){diffEl.classList.add('diff-down');el.classList.add('changed-input')}
              else{diffEl.classList.add('diff-zero');el.classList.add('ok-input')}
            });
            modalInputTotal.textContent=filled?fmt(total):'Belum diisi';
            if(filled<modalCatalog.length){
              modalInputDiff.textContent=filled+'/'+modalCatalog.length+' terisi';
              modalInputDiff.style.color='var(--purple)';
              return;
            }
            const d=total-109607234.55555555;
            modalInputDiff.textContent=fmt(d);
            modalInputDiff.style.color=d===0?'var(--green)':(d>0?'var(--amber)':'var(--red)');
          }
          '''
          s = re.sub(
              r'function calcModalInput\(\)\{.*?\n\}\n\n\nfunction bindPurchasePreviewButtons',
              new_calc + '\n\nfunction bindPurchasePreviewButtons',
              s,
              count=1,
              flags=re.S
          )

          # 2) Tema profesional hitam-putih-ungu neon, dengan warna status yang tetap jelas.
          if 'V26 THEME BLACK WHITE PURPLE NEON' not in s:
              theme = r'''
          /* V26 THEME BLACK WHITE PURPLE NEON */
          :root{
            --navy:#08080b;--navy2:#151019;--ink:#17131d;--muted:#746d80;--line:#e9e3ef;
            --bg:#f8f7fb;--card:#ffffff;--blue:#8b5cf6;--purple:#8b5cf6;--purple-neon:#a855f7;
            --purple-dark:#5b21b6;--green:#15945f;--amber:#d97706;--orange:#d97706;--red:#d9363e;
            --cyan:#0891b2;--soft:#f5f0ff;--shadow:0 12px 34px rgba(67,35,92,.09)
          }
          body{background:radial-gradient(circle at 82% 0,rgba(168,85,247,.08),transparent 28%),linear-gradient(180deg,#fbfaff 0,#f7f6fa 100%)}
          .side{background:linear-gradient(180deg,#08080b 0%,#100b14 58%,#09090b 100%);border-right:1px solid rgba(168,85,247,.22);box-shadow:8px 0 30px rgba(39,12,55,.12)}
          .logo{background:#fff;color:#09090b;box-shadow:0 0 0 2px rgba(168,85,247,.2),0 0 22px rgba(168,85,247,.18)}
          .brand small{color:#c8b7d5}.nav-title{color:#9d89ad}.nav button{color:#d8cedf}.nav button:hover{background:rgba(168,85,247,.08);color:#fff}.nav button.active{background:linear-gradient(90deg,rgba(168,85,247,.28),rgba(124,58,237,.12));color:#fff;border:1px solid rgba(192,132,252,.24);box-shadow:inset 3px 0 0 #c084fc}.active .dot{background:#c084fc;box-shadow:0 0 12px #a855f7}.side-foot{border-color:rgba(192,132,252,.18);background:rgba(168,85,247,.06)}
          .topbar{background:rgba(255,255,255,.96);border-bottom:1px solid #eee7f4;box-shadow:0 8px 30px rgba(63,36,83,.04)}
          .avatar{background:linear-gradient(135deg,#ede9fe,#f5d0fe);color:#6d28d9;border:1px solid #ddd6fe}
          .card{border-color:#ebe4f1;box-shadow:var(--shadow)}
          .kpi{position:relative;overflow:hidden}.kpi:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:#8b5cf6}.kpi:nth-child(2):before{background:#0891b2}.kpi:nth-child(3):before{background:#15945f}.kpi:nth-child(4):before{background:#d97706}
          .step.active{background:#f4efff;border-color:#c4b5fd;color:#6d28d9;box-shadow:0 5px 16px rgba(124,58,237,.08)}.step.active .n{background:#e9d5ff;color:#6d28d9}.step.done{background:#f0fdf6;border-color:#bbf7d0;color:#15803d}
          .btn{transition:.18s ease}.btn:hover{transform:translateY(-1px)}.btn.primary{background:#0a0a0d;color:#fff;border-color:#7c3aed;box-shadow:0 6px 18px rgba(124,58,237,.16)}.btn.primary:hover{background:#151018;border-color:#a855f7}.btn.blue{background:linear-gradient(135deg,#7c3aed,#a855f7);border-color:#8b5cf6;color:#fff;box-shadow:0 7px 20px rgba(139,92,246,.24)}
          .subtab.active{background:linear-gradient(135deg,#121014,#2a1734);border-color:#8b5cf6;color:#fff;box-shadow:0 5px 16px rgba(139,92,246,.14)}
          .pill.blue,.status.info{color:#6d28d9;background:#f5f0ff;border-color:#ddd6fe}.notice.blue{background:#f6f1ff;border-color:#ddd6fe;color:#5b21b6}.notice.amber{background:#fff8eb}.notice.red{background:#fff2f3}.pill.green,.status.ok{background:#edfcf5;border-color:#c7f1da;color:#087443}
          .table th{background:linear-gradient(180deg,#fbf9fd,#f6f1fa);color:#6d6177;border-bottom-color:#e5dbee}.table tbody tr:hover td{background:#fcfaff}.sumrow{border-bottom-color:#eee7f2}
          .input,.select{border-color:#ddd5e5;background:#fff}.input:hover,.select:hover{border-color:#c7b7d6}.input:focus,.select:focus{outline:0;border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.12)}.money-entry:focus{border-color:#a855f7!important;box-shadow:0 0 0 3px rgba(168,85,247,.12)!important}
          .calcbox{background:#faf8fc;border-color:#e9e1ef}.calcbox.good{background:#effbf5;border-color:#ccebdc}.calcbox.bad{background:#fff2f3;border-color:#f3c5c8}.metric{border-color:#e9e1ef}.fill{background:linear-gradient(90deg,#7c3aed,#c084fc)}
          .section-head h3{position:relative}.section-head h3:after{content:"";display:block;width:42px;height:3px;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#c084fc);margin-top:7px}.progress-card{border-color:#e7def0}
          .diff-pending{background:#f8f5fb!important;color:#7c6f88!important;font-weight:700}.pending-input{background:#fcfbfd!important;border-style:dashed!important;border-color:#b9a8c6!important}
          .modal-row .modal-input:placeholder-shown{background:#fcfbfd;color:#7d7188}.modal-row .modal-input:not(:placeholder-shown){background:#fff}
          .footer-actions{border-top:1px solid #eee7f2;padding-top:14px}.footer-actions .btn{pointer-events:auto!important;cursor:pointer!important}
          '''
              s = s.replace('</style>', theme + '\n</style>', 1)

          s = s.replace('UI COMPLETE V25 — MULTIPLE ENTRY', 'UI V26 — PURPLE NEON')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,flags=re.S))
          Path('/tmp/konter-anisa-v26.js').write_text(scripts,encoding='utf-8')
          PY
          node --check /tmp/konter-anisa-v26.js

      - name: Commit V26
        run: |
          git config user.name "chatgpt-v26"
          git config user.email "chatgpt-v26@users.noreply.github.com"
          if ! git diff --quiet; then
            git add index.html
            git commit -m "V26 blank modal inputs and purple neon professional theme"
            git push
          else
            echo "No changes"
          fi
