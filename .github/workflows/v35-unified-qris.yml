name: V35 Unified QRIS
on:
  push:
    paths:
      - '.github/workflows/v35-unified-qris.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load V35 unified QRIS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="transactions-v35.js?v=35"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate V35 JavaScript
        run: node --check transactions-v35.js
      - name: Commit
        run: |
          git config user.name "chatgpt-v35"
          git config user.email "chatgpt-v35@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "V35 load unified QRIS source flow"
          git push
