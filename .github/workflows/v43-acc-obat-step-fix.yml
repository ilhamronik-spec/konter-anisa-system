name: V43 ACC Obat Step Fix
on:
  push:
    paths:
      - 'transactions-v43.js'
      - '.github/workflows/v43-acc-obat-step-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load V43 after V42
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="transactions-v43.js?v=43"></script>'
          if tag not in s:
              marker='<script src="transactions-v42.js?v=42"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag)
              else:
                  s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'chatgpt-v43'
          git config user.email 'chatgpt-v43@users.noreply.github.com'
          git add index.html
          git commit -m 'V43 load dedicated ACC Obat step fix'
          git push
