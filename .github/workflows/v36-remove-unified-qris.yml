name: V36 Rollback Unified QRIS
on:
  push:
    paths:
      - '.github/workflows/v36-remove-unified-qris.yml'
permissions:
  contents: write
jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original QRIS Dana and QRIS Bank layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for tag in [
              '<script src="transactions-v35.js"></script>\n',
              '<script src="transactions-v35.js"></script>',
              '<script src="./transactions-v35.js"></script>\n',
              '<script src="./transactions-v35.js"></script>'
          ]:
              s=s.replace(tag,'')
          p.write_text(s,encoding='utf-8')
          Path('transactions-v35.js').unlink(missing_ok=True)
          Path('.github/workflows/v35-unified-qris.yml').unlink(missing_ok=True)
          PY
      - name: Commit rollback
        run: |
          git config user.name "chatgpt-v36"
          git config user.email "chatgpt-v36@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "V36 restore original QRIS Dana and QRIS Bank forms"
          git push
