name: V40 Minyak

on:
  push:
    branches: [ main ]
    paths:
      - 'transactions-v40.js'
      - '.github/workflows/v40-minyak.yml'

permissions:
  contents: write

jobs:
  inject-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Load V40 script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="transactions-v40.js"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('No </body> tag found')
              s=s.replace('</body>', tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit loader
        run: |
          if git diff --quiet -- index.html; then
            echo 'Loader already present.'
            exit 0
          fi
          git config user.name 'chatgpt-v40'
          git config user.email 'chatgpt-v40@users.noreply.github.com'
          git add index.html
          git commit -m 'V40 load Minyak exact decimal calculation'
          git push
